name: Build and Publish Library

on:
  pull_request:
    branches:
      - master
      - release/**
      - feature/**
      - hotfix/**
    types:
      - closed
    tags:
      - 'v*'

jobs:
  setup:
    name: Compile Project
    runs-on: ubuntu-latest

    outputs:
      versionType: ${{ steps.major.outputs.versionType || steps.minor.outputs.versionType || steps.patch.outputs.versionType }}
      dir: ${{ steps.yarnCacheDir.outputs.dir }}

    steps:
      - name: Checkout App
        uses: actions/checkout@v2
      - name: Setup Node.js environment
        uses: actions/setup-node@v2.1.5
        with:
          node-version: '20.14.0'
          registry-url: https://npm.pkg.github.com/
          scope: '@iamdipankarj'

      - name: Get yarn cache directory path
        id: yarnCacheDir
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - name: Check yarn dependencies in cache
        uses: actions/cache@v2
        id: yarn-cache
        with:
          path: ${{ steps.yarnCacheDir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      # Set versions according to branch prefix
      # Major
      - name: Version setup - Major
        id: major
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release') && startsWith(github.base_ref, 'master') && github.event.pull_request.merged == true
        run: |
          echo "::set-output name=versionType::major"
      # Minor
      - name: Version setup - Minor
        id: minor
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature') && startsWith(github.base_ref, 'master') && github.event.pull_request.merged == true
        run: |
          echo "::set-output name=versionType::minor"
      # Patch
      - name: Version setup - Patch
        id: patch
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix') && startsWith(github.base_ref, 'master') && github.event.pull_request.merged == true
        run: |
          echo "::set-output name=versionType::patch"
  publish:
    name: Publish Library
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      # Checkout App
      - name: Checkout App
        uses: actions/checkout@v2
      - name: Setup Node.js environment
        uses: actions/setup-node@v2.1.5
        with:
          node-version: '20.9.0'
          scope: '@iamdipankarj'

      # Set bot user config
      - name: Set git config
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "Kompoze Auto Versioning"

      - name: Install Packages
        run: yarn install --frozen-lockfile --ignore-scripts

        # Install Rollup
      - name: Install Rollup
        run: yarn global add rollup --ignore-scripts

      # Push the release
      - name: Release Package
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.DEPLOY_KEY }}
        with:
          tag_name: v${{ steps.package-version.outputs.current-version }}
          release_name: v${{ steps.package-version.outputs.current-version }}
          body: Pushing Release to Github Packages
          draft: false
          prerelease: false
