name: Publish to NPM

on:
  pull_request:
    branches:
      - master
      - release/**
      - feature/**
      - hotfix/**
    types:
      - closed
    tags:
      - 'v*'

jobs:
  setup:
    name: Compile Project
    runs-on: ubuntu-latest

    outputs:
      versionType: ${{ steps.major.outputs.versionType || steps.minor.outputs.versionType || steps.patch.outputs.versionType }}

    steps:
      - name: Checkout App
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      # Major
      - name: Version setup - Major
        id: major
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release') && startsWith(github.base_ref, 'master') && github.event.pull_request.merged == true
        run: |
          echo "versionType=major" >> $GITHUB_OUTPUT

      # Minor
      - name: Version setup - Minor
        id: minor
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature') && startsWith(github.base_ref, 'master') && github.event.pull_request.merged == true
        run: |
          echo "versionType=minor" >> $GITHUB_OUTPUT

      # Patch
      - name: Version setup - Patch
        id: patch
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix') && startsWith(github.base_ref, 'master') && github.event.pull_request.merged == true
        run: |
          echo "versionType=patch" >> $GITHUB_OUTPUT

  publish:
    name: Publish Library
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout App
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache

      - name: Set git config
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "Kompoze Auto Versioning"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Update Package version
      - name: Updating Package version
        run: |
          yarn version --${{ needs.setup.outputs.versionType }}
          git push origin ${{ github.base_ref }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn publish --access public

      - name: Get Package Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master

      # Push the release
      - name: Release Package
        id: create_release
        uses: actions/create-release@v1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          tag_name: v${{ steps.package-version.outputs.current-version }}
          release_name: v${{ steps.package-version.outputs.current-version }}
          body: Pushing Release to Github Packages
          draft: false
          prerelease: false
